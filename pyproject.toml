[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-production-toolkit"
version = "0.2.0"
description = "Production-ready backend utilities (config, logging, monitoring)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "amirmahdi", email = "jamshidiamirmahdi1@gmail.com" }]

dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "pymongo>=4.6", "dnspython>=2.6", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]
